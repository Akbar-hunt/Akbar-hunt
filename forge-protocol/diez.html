<title>DIEZ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first match-centre app. Sticky header, one scrolling view, fixed bottom tab bar with the VAR button in the middle. */
:root {
  --bg: #F1F2EF; --surface: #FFFFFF; --surface-2: #E8EAE6; --fg: #121614; --muted: #5E6762; --line: #D8DCD8;
  --garnet: #A3123A; --blue: #1D4AA8; --win: #1E8449; --draw: #B37F12; --loss: #C2352B; --on-accent: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C0F12; --surface: #151A1F; --surface-2: #1D232A; --fg: #E8ECEE; --muted: #8F98A0; --line: #262D35;
  --garnet: #E24A72; --blue: #6A97F2; --win: #3CC27A; --draw: #E2B04A; --loss: #F0604F; --on-accent: #0C0F12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0C0F12; --surface: #151A1F; --surface-2: #1D232A; --fg: #E8ECEE; --muted: #8F98A0; --line: #262D35;
  --garnet: #E24A72; --blue: #6A97F2; --win: #3CC27A; --draw: #E2B04A; --loss: #F0604F; --on-accent: #0C0F12; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.inner { max-width: 640px; margin: 0 auto }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px }
.top .inner { display: flex; align-items: center; gap: 12px }
.brand { font: 800 26px/1 var(--display); letter-spacing: .04em; display: flex; align-items: baseline; gap: 6px }
.brand b { color: var(--garnet) }
.meta { font: 500 12px/1.3 var(--mono); color: var(--muted); flex: 1; min-width: 0; font-variant-numeric: tabular-nums }
.sync { width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.sync.on { background: var(--win) }

main { padding-block: 16px 120px; display: flex; flex-direction: column; gap: 16px }
main > .inner { display: flex; flex-direction: column; gap: 16px; width: 100% }
h2 { font: 700 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; text-wrap: balance }
h3 { font: 700 17px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 0 }
p { margin: 0 }
.lab { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.small { font-size: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.stack { display: flex; flex-direction: column; gap: 10px }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.code-line { font-style: italic; color: var(--muted); font-size: 15px }

/* rating */
.rating { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center }
.badge { width: 92px; height: 92px; border-radius: 18px; display: grid; place-items: center; font: 800 44px/1 var(--display); color: var(--on-accent); font-variant-numeric: tabular-nums }
.W { background: var(--win) } .D { background: var(--draw) } .L { background: var(--loss) } .N { background: var(--surface-2); color: var(--muted) }
.res-txt { font: 700 20px/1.1 var(--display); text-transform: uppercase }
.breakdown { font: 500 12px/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.mm { display: flex; flex-wrap: wrap; gap: 6px }
.pill { font: 600 12px/1 var(--body); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted) }
.pill.ok { background: var(--win); border-color: var(--win); color: var(--on-accent) }
.pill.bad { background: var(--loss); border-color: var(--loss); color: var(--on-accent) }

.banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; border: 1px solid var(--line); background: var(--surface); border-left: 4px solid var(--blue) }
.banner.hot { border-left-color: var(--loss) }
.banner.warn { border-left-color: var(--draw) }
.banner b { font-family: var(--display); text-transform: uppercase; letter-spacing: .04em; font-size: 15px }

/* timetable */
.tt { display: flex; flex-direction: column }
.blk { display: grid; grid-template-columns: 52px 1fr 40px; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start }
.blk:first-child { border-top: 0 }
.blk .time { font: 700 13px/1.4 var(--mono); font-variant-numeric: tabular-nums; padding-top: 2px }
.blk .code { font: 700 13px/1 var(--display); letter-spacing: .08em; color: var(--garnet); text-transform: uppercase }
.blk .t { font-weight: 600; margin-top: 3px }
.blk .d { font-size: 14px; color: var(--muted); margin-top: 2px }
.blk.now { background: var(--surface-2); margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 10px; border-top-color: transparent }
.blk.now .time { color: var(--blue) }
.blk.past:not(.done) .t { color: var(--muted) }
.chk { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; font: 700 18px/1 var(--body); color: transparent }
.chk.on { background: var(--win); border-color: var(--win); color: var(--on-accent) }
.chk[disabled] { opacity: .35; cursor: default }
.free-tag { font: 500 10px/1 var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; padding-top: 10px; text-align: center }
.line-item { display: grid; grid-template-columns: 1fr 40px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line) }
.line-item:first-of-type { border-top: 0 }
.yel.on { background: var(--draw); border-color: var(--draw); color: var(--on-accent) }
.redc.on { background: var(--loss); border-color: var(--loss); color: var(--on-accent) }
.ctr { display: flex; align-items: center; gap: 10px }
.ctr button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700 }
.ctr span { font: 700 18px/1 var(--mono); min-width: 2ch; text-align: center }

.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.daynav button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600 }
.daynav button[disabled] { opacity: .35; cursor: default }
.daynav .dn-mid { text-align: center; min-width: 0 }
.dn-mid strong { font: 700 18px/1.1 var(--display); text-transform: uppercase; display: block }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--garnet); color: var(--on-accent) }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg) }
.btn.blue { background: var(--blue) }
input[type=text], input[type=number], input[type=date], textarea, select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0 }
textarea { width: 100%; min-height: 96px; resize: vertical; line-height: 1.5 }
.toggle { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.toggle:first-of-type { border-top: 0 }
.sw { width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); transition: left .15s }
.sw.on { background: var(--win) } .sw.on::after { left: 23px }

/* season */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px }
.stat .v { font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums }
.form { display: flex; gap: 4px }
.form span { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font: 700 13px/1 var(--display); color: var(--on-accent) }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px/1 var(--mono); color: var(--muted) }
.wd .b { width: 100%; aspect-ratio: 1; max-width: 48px; border-radius: 8px; display: grid; place-items: center; font: 700 15px/1 var(--display); color: var(--on-accent); font-variant-numeric: tabular-nums }
.wd .b.N { color: var(--muted) }
.wd.today .b { outline: 2px solid var(--blue); outline-offset: 2px }
.chart { width: 100%; overflow-x: auto }
.chart svg { display: block; width: 100%; height: auto; min-width: 300px }
.ax { font: 500 13px var(--mono); fill: var(--muted) }
.grid-l { stroke: var(--line); stroke-width: 1 }
.thr { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3 }
.tgt { stroke: var(--blue); stroke-width: 2; stroke-dasharray: 5 4; fill: none }
.act { stroke: var(--garnet); stroke-width: 2.5; fill: none }
.dot { fill: var(--garnet) }
.bar-W { fill: var(--win) } .bar-D { fill: var(--draw) } .bar-L { fill: var(--loss) } .bar-N { fill: var(--surface-2) }
.phase-bar { display: grid; grid-template-columns: 14fr 42fr 44fr; gap: 3px; position: relative }
.phase-bar div { height: 10px; background: var(--surface-2); border-radius: 3px }
.phase-bar div.cur { background: var(--garnet) }
.phase-lab { display: grid; grid-template-columns: 14fr 42fr 44fr; gap: 3px; font: 500 10px/1.2 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 8px 8px; border-top: 1px solid var(--line); vertical-align: top }
th { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 0 }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.tbl { overflow-x: auto }
.x { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 0 4px }

/* plan */
.layers { display: flex; flex-direction: column; gap: 6px }
.layer { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 10px; background: var(--surface-2) }
.layer .ln { font: 800 26px/1 var(--display); color: var(--garnet) }
.layer strong { font: 700 17px/1.1 var(--display); text-transform: uppercase; letter-spacing: .04em; display: block }
.layer span { font-size: 14px; color: var(--muted) }
ul.clean { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px }
.ladder { display: flex; flex-direction: column; gap: 0 }
.rung { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line) }
.rung:first-child { border-top: 0 }
.rung .ln { font: 800 18px/1.2 var(--display); color: var(--muted) }
.rung.here .ln { color: var(--garnet) }
.rung strong { font-weight: 700 }
.formula { font: 500 13px/1.7 var(--mono); background: var(--surface-2); border-radius: 10px; padding: 12px; overflow-x: auto; white-space: pre }
details { border-top: 1px solid var(--line); padding-top: 10px }
details summary { cursor: pointer; font: 700 16px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; list-style: none; display: flex; justify-content: space-between }
details summary::after { content: "+"; color: var(--muted) }
details[open] summary::after { content: "–" }
details > div { padding-top: 10px; display: flex; flex-direction: column; gap: 10px }

/* nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)) }
.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end }
.tab { border: 0; background: none; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 11px/1 var(--body); color: var(--muted) }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2 }
.tab.on { color: var(--garnet) }
.var-btn { justify-self: center; width: 60px; height: 60px; margin-top: -22px; border-radius: 50%; border: 4px solid var(--bg); background: var(--loss); color: var(--on-accent); font: 800 18px/1 var(--display); letter-spacing: .06em; box-shadow: 0 4px 14px rgba(0,0,0,.25) }

/* VAR sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)) }
.sheet .inner { display: flex; flex-direction: column; gap: 14px }
.var-head { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.var-title { font: 800 34px/1 var(--display); color: var(--loss); letter-spacing: .04em }
.sits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.sit { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-weight: 600; min-height: 64px }
.sit small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; font-size: 16px }
.timer { font: 800 64px/1 var(--display); text-align: center; font-variant-numeric: tabular-nums }
.quote { border-left: 4px solid var(--garnet); padding: 8px 14px; font-size: 17px; font-style: italic }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
@media (max-width: 380px) { .badge { width: 76px; height: 76px; font-size: 36px } .sits { grid-template-columns: 1fr } }
</style>

<header class="top pad"><div class="inner">
  <div class="brand">DIEZ<b>·</b></div>
  <div class="meta" id="meta">Loading…</div>

</div></header>

<main class="pad"><div class="inner" id="view"></div></main>

</div></nav>

<script>
/* ============ constants ============ */
const START_WEIGHT = 82, GOAL_WEIGHT = 68, KG_PER_WEEK = 0.6;
const HIS_CODE = "Change is the small habits you practice every day to become better than you were yesterday.";
const HIS_JOY = "The feeling of holding a ball at my feet gives me the best joy.";
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const SETUP = [
  ["delete", "Delete TikTok and X from your phone. Delete them, don't just limit them."],
  ["dns", "Turn on the adult-content filter. Android: Settings → Network → Private DNS → family.cloudflare-dns.com. iPhone: Screen Time → Content & Privacy → Limit Adult Websites."],
  ["gray", "Turn on grayscale at night (Digital Wellbeing → Bedtime mode)."],
  ["timers", "Set app timers: YouTube 30 min, series app 45 min."],
  ["charger", "Move the phone charger away from your bed."],
  ["alarm", "Set the alarm for Day 1 at 10:00. It moves earlier every 3 days."],
  ["food", "Buy eggs, curd, paneer or chicken, oats, bananas and roasted chana."],
  ["foot", "Get your 5th metatarsal checked by a doctor or sports physio. Sprint sessions stay locked until you tick this."],
  ["room", "Clean your room. Lay out training clothes for Day 1."],
  ["code", "Write your code in the Dressing room."]
];

const YELLOWS = [
  ["alcohol", "Alcohol"],
  ["fastfood", "Fast food outside the Sunday free meal"],
  ["phonebed", "Phone in bed after lights out"],
  ["overtime", "Games or series past the limit"]
];

const TESTS = {
  run5k: { name: "5 km run", unit: "min:sec", target: "under 25:00", better: "low", start: "30–35 min" },
  pushups: { name: "Push-ups in a row", unit: "reps", target: "30", better: "high", start: "6–15" },
  sprint30: { name: "30 m sprint", unit: "seconds", target: "under 4.3", better: "low", start: "Day 1" },
  juggle: { name: "Juggling record", unit: "touches", target: "200", better: "high", start: "Day 1" }
};

/* Pre-season and Competition split. am/pm per weekday (1 = Monday … 6 = Saturday) */
const SPLIT = {
  1: { am: ["SPEED", "Warm-up 15 min (jog, skips, leg swings). 8 × 20 m accelerations, walk back + 60 s rest. 6 × 10 m reaction starts. 20 min ball mastery."],
       pm: ["GYM · LOWER", "Goblet or back squat 4×6–8, Romanian deadlift 3×8, split squat 3×8 each leg, slow calf raises 3×15, Copenhagen plank 3×20 s."] },
  2: { am: ["ENGINE", "Norwegian 4×4: 10 min warm-up, then 4 × 4 min hard running (a few words possible, no sentences) with 3 min jog between."],
       pm: ["FINISHING", "100 shots: 50 right foot, 50 left. Edge of the box, first-time, after a dribble. Count your goals and log the number."] },
  3: { am: ["BALL MASTERY", "45 min: sole rolls, V-pulls, inside-outside, wall passes with both feet, one juggling record attempt. 15 min mobility."],
       pm: ["GYM · UPPER + CORE", "Push-ups 4 × (max − 2), rows 4×10, overhead press 3×8, band pull-aparts 3×15, plank 3×45 s, dead bugs 3×10."] },
  4: { am: ["TEMPO", "10 × 100 m at 70% pace, walk back between. Builds stamina without sprinting."],
       pm: ["1v1 & DUELS", "Dribble moves at speed through cones, shielding against a wall or a friend, receiving on the half-turn, 15 min defensive footwork (jockeying, recovery runs)."] },
  5: { am: ["AGILITY", "Ladder 10 min, 5-10-5 shuttle × 6, T-drill × 6, 6 × 30 m sprints with full rest."],
       pm: ["GYM · POWER", "Jump squats 4×5, broad jumps 4×4, dumbbell or trap-bar deadlift 3×5, push press 3×5, farmer carry 3 × 30 m."] },
  6: { am: ["MATCH DAY", "Play 11-a-side or small-sided with anyone you can find. Log minutes, goals and assists. No game? 6 km steady run + 30 min technical work."],
       pm: ["RECOVERY", "20 min stretching, foam roll, foot rehab. Film one drill or your juggling for your highlight reel."] }
};
const LOCKED_SPEED = ["SPEED · LOCKED", "Your foot isn't cleared yet. Do 30 min tempo jog on grass + 20 min ball mastery instead. Sprints unlock when you tick \"Foot checked\" in Plan."];

const VAR_SITS = {
  urge: { t: "Porn urge", s: "Alone, late, phone in hand", steps: [
    "Stand up now. Leave the room or go where your roommates are.",
    "Put the phone face down on a table that isn't yours. Don't take it with you.",
    "20 push-ups or 50 jumping jacks. Right now.",
    "Cold water on your face and wrists.",
    "Start the 10-minute timer. An urge peaks and then drops. You only have to outlast it, not beat it forever.",
    "Read your code below. Then tap \"Urge beaten\"."], timer: true, urge: true },
  scroll: { t: "Scroll trap", s: "Been on the phone too long", steps: [
    "Say out loud: \"Stop.\"",
    "Look at the timetable. What block should you be in right now?",
    "Phone goes to the charger across the room.",
    "Do the first 2 minutes of that block. Just 2 minutes, then decide.",
    "If it's after Full-time, phone stays on the charger and you go to bed."] },
  start: { t: "Can't start", s: "Task feels too big", steps: [
    "Shrink it. Write the smallest next step (\"open the notes\", \"write one line\").",
    "Set a 5-minute timer. You're allowed to quit after 5 minutes.",
    "Phone in another room. Close every tab you don't need.",
    "When the 5 minutes are up, decide: keep going or stop. Most days you'll keep going."] },
  train: { t: "Don't want to train", s: "Tired, lazy, no motivation", steps: [
    "Put your boots or trainers on. That's the only job.",
    "Go outside and start the warm-up. Promise yourself just 10 minutes.",
    "After 10 minutes, if you still feel sick or in pain, stop and log Injury time. If you're just lazy, finish the session.",
    "Remember why: " + HIS_JOY] },
  night: { t: "Late-night spiral", s: "Overthinking, can't sleep", steps: [
    "Phone out of reach. Lights off.",
    "Breathe 4-7-8: in for 4 seconds, hold for 7, out for 8. Do it 4 times.",
    "If your head is loud, write it down on paper: what's worrying you and the one thing you'll do about it tomorrow.",
    "Lie back down. Not sleeping is fine. Resting with eyes closed still counts."] },
  ate: { t: "I ate badly", s: "Fast food, binge, late snack", steps: [
    "Log the yellow card if it applies. Be honest.",
    "No starving tomorrow. Your next meal is a normal Fuel meal.",
    "Drink 500 ml water and go for a 15-minute walk.",
    "One bad meal doesn't make you fat. Ten in a row do. Stop at one."] },
  lost: { t: "I lost the day", s: "Streak broken, feel like quitting", steps: [
    "Read this: missing once is an accident. Missing twice starts a pattern.",
    "Tomorrow is a Bounce-back match. You only need the Minimum Match: wake on time, train, Deep Work 1, clean, lights out.",
    "Do one small thing tonight: lay out your clothes, set the alarm, phone on the charger.",

/* ============ dates ============ */
const pad2 = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(a) - parseKey(b)) / 864e5);
const matchKey = () => { const d = new Date(); if (d.getHours() < 4) d.setDate(d.getDate() - 1); return keyOf(d); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + (d.getHours() < 4 ? 1440 : 0); };
const hm = m => `${pad2(Math.floor(m / 60) % 24)}:${pad2(m % 60)}`;
const prettyDate = k => parseKey(k).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ============ the plan generator ============ */
function wakeFor(n) { return n <= 3 ? 600 : n <= 6 ? 510 : n <= 9 ? 420 : n <= 12 ? 375 : 330; }
function phaseOf(n) {
  if (n <= 14) return { id: "reset", name: "Reset", note: "Days 1–14 · sleep shift, phone detox, base fitness" };
  if (n <= 56) return { id: "pre", name: "Pre-season", note: "Weeks 3–8 · full schedule, two sessions a day" };
  return { id: "comp", name: "Competition", note: "Week 9+ · club football, matches, sharpening" };
}

function planFor(key) {
  const n = diffDays(key, profile.start) + 1;
  const phase = phaseOf(n), week = Math.ceil(n / 7), dow = parseKey(key).getDay();

    blocks = [

      [495, 110, { id: "deep1", code: "DEEP WORK 1", t: "2 × 50 min, phone in another room", d: exam ? "Past papers. Mark them yourself." : "Hardest subject first. 10 min break between the two blocks.", w: 3, core: "study" }],

      [1140, 90, { id: "free", code: exam ? "DEEP WORK 4" : "RECHARGE", t: exam ? "Exam revision, 60 min" : "Free time, earned", d: exam ? "Past papers, then a family call." : "Family call, stretching, one episode max.", w: exam ? 2 : 0 }],
      [1245, 30, { id: "shutdown", code: "FULL-TIME", t: "Shutdown + rate the match", d: "Phone on the charger across the room. Screens off. Write tomorrow's first task.", w: 2 }],
      [1290, 0, { id: "lights", code: "LIGHTS OUT", t: "In bed, lights off", d: "The phone is never in the bed.", w: 3, core: "sleep" }]

    { id: "steps", t: reset ? "8,000 steps" : "10,000 steps", w: 1, train: true },

  if (faith) trackers.push({ id: "prayers", t: "5 prayers", w: 2 });
  return { n, phase, week, dow, deload, blocks, trackers };
}

/* ============ the rating algorithm ============ */
function blankDay() { return { c: {}, y: {}, red: false, urges: 0, injury: false }; }
function computeRating(key) {
  const plan = planFor(key), log = days[key] || blankDay(), c = log.c || {};
  let earned = 0, poss = 0;
  for (const it of [...plan.blocks, ...plan.trackers]) {
    if (!it.w || (log.injury && it.train)) continue;
    poss += it.w; if (c[it.id]) earned += it.w;
  }
  const base = poss ? 10 * earned / poss : 0;
  const yellows = Object.values(log.y || {}).filter(Boolean).length;
  const bonus = Math.min(3, log.urges || 0) * 0.2;
  const trainDone = log.injury || plan.blocks.some(b => b.core === "train" && c[b.id]);
  const core = { wake: !!c.kickoff, train: !!trainDone, study: !!c.deep1, clean: !log.red, sleep: !!c.lights };
  const coreAll = Object.values(core).every(Boolean);
  let r = base - 0.5 * yellows + bonus;
  if (log.red) r = Math.min(r, 4.9); else if (coreAll) r = Math.max(r, 5.0);
  r = Math.round(Math.max(0, Math.min(10, r)) * 10) / 10;
  return { r, res: r >= 7 ? "W" : r >= 5 ? "D" : "L", base, yellows, bonus, earned, poss, core, coreAll };
}
function resultFor(key) {
  const today = matchKey();
  if (!profile.start || key < profile.start || key > today) return null;
  const log = days[key];
  if (key === today) return Object.assign(computeRating(key), { live: true });
  if (!log) return { r: 0, res: "L", missing: true };
  const r = typeof log.r === "number" ? log.r : computeRating(key).r;
  return { r, res: r >= 7 ? "W" : r >= 5 ? "D" : "L" };
}

/* ============ storage: db when available, this device otherwise ============ */
let db = null, uid = null;
const writing = {}, dirty = {}, timers = {};
function cacheLocal() { try { localStorage.setItem("diez-cache", JSON.stringify({ profile, days })); } catch (e) {} }
function profileRef() { return db.doc(`data/users/${uid}/profile`); }
function dayRef(k) { return profileRef().collection("days").doc(k); }
function persist(kind, key) {
  cacheLocal();
  if (!db) return;
  const path = kind === "p" ? "p" : "d:" + key;
  clearTimeout(timers[path]);
  timers[path] = setTimeout(() => { delete timers[path]; flush(path, kind, key); }, 500);
}
async function flush(path, kind, key) {
  if (writing[path]) { dirty[path] = true; return; }
  writing[path] = true;
  try {
    do {
      dirty[path] = false;
      const ref = kind === "p" ? profileRef() : dayRef(key);
      const data = JSON.parse(JSON.stringify(kind === "p" ? profile : days[key]));
      try { await ref.set(data); }
      catch (e) {
        if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); await ref.set(data); }
        else { setSync(false, "Couldn't sync. Saved on this device."); break; }
      }
    } while (dirty[path]);
  } catch (e) { setSync(false, "Couldn't sync. Saved on this device."); }
  writing[path] = false;
}
const busy = path => writing[path] || timers[path];
function setSync(on, title) { const s = document.getElementById("sync"); s.classList.toggle("on", on); s.title = title; }

async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d; uid = id;
    setSync(true, "Synced to your account");
    let first = true;
    profileRef().onSnapshot(snap => {
      if (busy("p")) return;
      if (snap.exists) { profile = Object.assign({ setup: {}, manifesto: {}, weights: [], tests: [] }, snap.data()); }
      else if (first && profile.start) { persist("p"); Object.keys(days).forEach(k => persist("d", k)); }
      first = false; cacheLocal(); softRender();
    }, () => setSync(false, "Sync stopped. Saved on this device."));
    profileRef().collection("days").onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        const k = ch.doc.id;
        if (busy("d:" + k)) return;
        if (ch.type === "removed") delete days[k]; else days[k] = ch.doc.data();
      });
      cacheLocal(); softRender();
    }, () => setSync(false, "Sync stopped. Saved on this device."));
  } catch (e) { db = null; }
}

/* ============ mutations ============ */
function setDay(key, mut) {
  const d = JSON.parse(JSON.stringify(days[key] || blankDay()));
  d.c = d.c || {}; d.y = d.y || {};
  mut(d); days[key] = d;
  d.r = computeRating(key).r;
  persist("d", key); render();
}
function setProfile(mut, rerender = true) { mut(profile); persist("p"); if (rerender) render(); }

/* ============ render ============ */
function header() {
  const m = document.getElementById("meta");
  if (!profile.start) { m.textContent = "Pre-match · set your kick-off"; return; }

  if (n < 1) { m.textContent = `Kick-off in ${1 - n} day${1 - n === 1 ? "" : "s"}`; return; }

}

function nowCard(cur, next, nm) {
  let h = `<span class="lab">${cur ? "Now" : "Between blocks"}</span>`;

  return h;
}

  const started = today >= profile.start;

  let unbeaten = 0, clean = 0;
  if (started) {
    for (let k = today; k >= profile.start; k = addDays(k, -1)) {
      const r = resultFor(k); if (k === today && r.res === "L") continue;
      if (r.res === "L") break; unbeaten++;
    }
    for (let k = today; k >= profile.start; k = addDays(k, -1)) {

  const form = []; for (let i = 0; form.length < 5 && i < 60; i++) { const k = addDays(today, -i); const r = resultFor(k); if (!r) break; form.unshift(r); }

  <div class="stats">

    <div class="stat"><span class="lab">Form</span><div class="form">${form.map(r => `<span class="${r.res}">${r.res}</span>`).join("") || `<span class="muted small">–</span>`}</div><span class="small muted">last 5, newest right</span></div>
  </div>
  <section class="card"><h3>Matchweek ${wk}</h3><div class="week">${cells}</div>
    <p class="small"><b>${pts} pts</b> <span class="muted">· W${w} D${d} L${l} · target 15+ pts a week (5 wins)</span></p></section>`;

  h += `<section class="card"><h3>Ratings · last 28 days</h3><div class="chart">${ratingChart(today)}</div>
    <p class="small muted">Dashed lines: 5.0 (draw) and 7.0 (win). A day with nothing logged counts as 0.</p></section>`;

  const ws = [...profile.weights].sort((a, b) => a.d < b.d ? -1 : 1);
  const latest = ws.length ? ws[ws.length - 1].kg : START_WEIGHT;

    <div class="chart">${weightChart(ws)}</div>
    <div class="row"><input type="number" id="w-in" inputmode="decimal" step="0.1" min="40" max="150" placeholder="kg" style="width:110px" aria-label="Weight in kg"><button class="btn blue" data-act="addweight">Log weigh-in</button></div>
    <p class="small muted">Weigh in on Sunday mornings, after the toilet, before food. Single days jump around, so watch the trend.</p>
    ${ws.length ? `<div class="tbl"><table><tr><th>Date</th><th>kg</th><th></th></tr>${ws.slice(-6).reverse().map(e => `<tr><td>${prettyDate(e.d)}</td><td class="n">${e.kg}</td><td><button class="x" data-act="delw:${e.d}" aria-label="Delete">×</button></td></tr>`).join("")}</table></div>` : ""}
  </section>`;

  h += `<section class="card"><h3>Scouting tests</h3><p class="small muted">First Sunday of each month. Targets are for 12 weeks in.</p>

      return `<tr><td>${t.name}</td><td>${e.length ? esc(e[0].v) : t.start}</td><td class="n">${la ? esc(la.v) + `<br><span class="muted">${prettyDate(la.d)}</span>` : "–"}</td><td>${t.target}</td></tr>`; }).join("")}
    </table></div>
    <div class="row"><select id="t-kind" aria-label="Test">${Object.entries(TESTS).map(([id, t]) => `<option value="${id}">${t.name} (${t.unit})</option>`).join("")}</select>

  </section>`;
  return h;
}

function ratingChart(today) {
  const W = 560, H = 180, L = 30, B = 24, T = 8, cw = (W - L - 4) / 28;
  const y = v => T + (H - T - B) * (1 - v / 10);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Match ratings for the last 28 days">`;
  [0, 5, 7, 10].forEach(v => { s += `<line class="${v === 5 || v === 7 ? "thr" : "grid-l"}" x1="${L}" x2="${W - 2}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`; });
  for (let i = 0; i < 28; i++) {
    const k = addDays(today, i - 27), r = resultFor(k), x = L + 2 + i * cw;
    if (r) { const v = Math.max(r.r, 0.15); s += `<rect class="bar-${r.res}" x="${x}" y="${y(v)}" width="${cw - 3}" height="${y(0) - y(v)}" rx="2"/>`; }
    else s += `<rect class="bar-N" x="${x}" y="${y(0) - 2}" width="${cw - 3}" height="2"/>`;
    if (i % 7 === 6) s += `<text class="ax" x="${x + (cw - 3) / 2}" y="${H - 6}" text-anchor="middle">${parseKey(k).getDate()}/${parseKey(k).getMonth() + 1}</text>`;
  }
  return s + `</svg>`;
}

function weightChart(ws) {
  const W = 560, H = 210, L = 34, B = 24, T = 10, R = 8;
  const t0 = profile.start, weeks = 26;
  const maxKg = Math.max(START_WEIGHT + 2, ...ws.map(e => e.kg)), minKg = GOAL_WEIGHT - 2;
  const x = k => L + (W - L - R) * Math.min(1, Math.max(0, diffDays(k, t0) / (weeks * 7)));
  const y = v => T + (H - T - B) * (maxKg - v) / (maxKg - minKg);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend against the target line">`;
  for (let v = Math.ceil(minKg / 4) * 4; v <= maxKg; v += 4) s += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  const goalDay = addDays(t0, Math.round((START_WEIGHT - GOAL_WEIGHT) / KG_PER_WEEK * 7));
  s += `<polyline class="tgt" points="${x(t0)},${y(START_WEIGHT)} ${x(goalDay)},${y(GOAL_WEIGHT)} ${W - R},${y(GOAL_WEIGHT)}"/>`;
  [0, 8, 16, 24].forEach(wk => s += `<text class="ax" x="${x(addDays(t0, wk * 7))}" y="${H - 6}" text-anchor="${wk ? "middle" : "start"}">wk ${wk + 1}</text>`);
  if (ws.length) {
    s += `<polyline class="act" points="${ws.map(e => `${x(e.d)},${y(e.kg)}`).join(" ")}"/>`;
    ws.forEach(e => s += `<circle class="dot" cx="${x(e.d)}" cy="${y(e.kg)}" r="3.5"/>`);
  }
  s += `<text class="ax" x="${W - R}" y="${y(GOAL_WEIGHT) + 16}" text-anchor="end">goal ${GOAL_WEIGHT} kg</text>`;
  return s + `</svg>`;
}

  return `<section class="card"><span class="lab">Dressing room</span><h2>Your words</h2>
    <p class="small">Motivation from an app fades. Your own words don't. Write these yourself. VAR shows them to you in your weakest moments. Your first line is already here: you wrote it the day you started this.</p></section>
    ${ROOM.map(([id, t, hint, def]) => `<section class="card"><h3>${esc(t)}</h3><p class="small muted">${esc(hint)}</p>
      <textarea data-mf="${id}" id="mf-${id}" aria-label="${esc(t)}" placeholder="${esc(hint)}">${esc(profile.manifesto[id] ?? def)}</textarea></section>`).join("")}
    <p class="small muted">Saves as you type.</p>`;
}

function render() {
  header();
  const v = document.getElementById("view");
  v.innerHTML = tab === "today" ? viewToday() : tab === "season" ? viewSeason() : tab === "plan" ? viewPlan() : viewRoom();
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.act === "tab:" + tab));
  if (!document.getElementById("var").hidden) renderVar();
}
function softRender() {
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.tagName === "SELECT")) { header(); return; }
  render();
}

/* ============ VAR ============ */
function quoteLine() {
  const m = profile.manifesto;
  const lines = [m.night, m.code, m.why, m.letter].filter(s => s && s.trim());
  return lines.length ? lines[Math.floor(Math.random() * lines.length)].trim().split("\n")[0] : HIS_CODE;
}
function renderVar() {
  const b = document.getElementById("var-body");
  let h = `<div class="var-head"><span class="var-title">VAR</span><button class="btn ghost" data-act="var-close">Close</button></div>`;
  if (!varSit) {
    h += `<p>Stop. Before you do anything, review the play. What's happening right now?</p><div class="sits">
      ${Object.entries(VAR_SITS).map(([id, s]) => `<button class="sit" data-act="var-sit:${id}">${esc(s.t)}<small>${esc(s.s)}</small></button>`).join("")}</div>
      <div class="quote">“${esc(quoteLine())}”</div>`;
  } else {
    const s = varSit === "slipped" ? SLIPPED : VAR_SITS[varSit];
    h += `<button class="btn ghost" data-act="var-sit:" style="align-self:flex-start">‹ All situations</button><h2>${esc(s.t)}</h2>
      <ol class="steps">${s.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;
    if (s.timer) h += `<div class="card"><div class="timer" id="timer">${timerText()}</div><button class="btn blue" data-act="var-timer">${timerEnd ? "Restart 10:00" : "Start 10-minute timer"}</button></div>`;
    h += `<div class="quote">“${esc(quoteLine())}”</div>`;
    if (s.urge) h += `<div class="row"><button class="btn" style="background:var(--win)" data-act="var-beaten">Urge beaten (+0.2)</button><button class="btn ghost" data-act="var-slip">I slipped</button></div>`;
    else h += `<button class="btn" data-act="var-close">Back in the game</button>`;
  }
  b.innerHTML = h;
}
function timerText() {
  if (!timerEnd) return "10:00";
  const s = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
  return s ? `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}` : "Done ✓";
}
const SLIPPED = { t: "You slipped. Now the comeback.", s: "", steps: [
  "The red card is logged. Being honest about it is still discipline.",
  "Get up now. Shower, then leave the room for 20 minutes. Walk outside.",
  "Phone on the charger, out of reach, for the rest of the night.",
  "Tomorrow is a Bounce-back match. Minimum Match 5. Never lose twice.",
  "You are not the slip. You're the comeback after it."] };

/* ============ events ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const [act, arg] = el.dataset.act.split(/:(.*)/s);
  const k = viewKey;
  switch (act) {
    case "tab": tab = arg; if (tab === "today") viewKey = matchKey(); render(); window.scrollTo(0, 0); break;
    case "day": viewKey = addDays(viewKey, Number(arg)); render(); break;
    case "chk": setDay(k, d => { d.c[arg] = !d.c[arg]; }); break;
    case "yel": setDay(k, d => { d.y[arg] = !d.y[arg]; }); break;
    case "red": setDay(k, d => { d.red = !d.red; }); break;
    case "injury": setDay(k, d => { d.injury = !d.injury; }); break;
    case "urge": setDay(k, d => { d.urges = Math.max(0, (d.urges || 0) + Number(arg)); }); break;
    case "setup": setProfile(p => { p.setup = Object.assign({}, p.setup, { [arg]: !p.setup[arg] }); }); break;
    case "exam": setProfile(p => { p.exam = !p.exam; }); break;
    case "faith": setProfile(p => { p.faith = !p.faith; }); break;
    case "setstart": { const v = document.getElementById("start-date").value; if (!v) return; setProfile(p => { p.start = v; }); viewKey = matchKey(); break; }
    case "addweight": { const v = parseFloat(document.getElementById("w-in").value); if (!(v > 30 && v < 200)) return;
      const d = matchKey(); setProfile(p => { p.weights = p.weights.filter(x => x.d !== d).concat({ d, kg: Math.round(v * 10) / 10 }); }); break; }
    case "delw": setProfile(p => { p.weights = p.weights.filter(x => x.d !== arg); }); break;
    case "addtest": { const kind = document.getElementById("t-kind").value, v = document.getElementById("t-val").value.trim(); if (!v) return;
      const d = matchKey(); setProfile(p => { p.tests = p.tests.filter(x => !(x.k === kind && x.d === d)).concat({ d, k: kind, v: v.slice(0, 12) }); }); break; }
    case "var-open": varSit = null; document.getElementById("var").hidden = false; renderVar(); document.body.style.overflow = "hidden"; break;
    case "var-close": document.getElementById("var").hidden = true; document.body.style.overflow = ""; clearInterval(timerInt); timerEnd = 0; render(); break;
    case "var-sit": varSit = arg || null; renderVar(); document.getElementById("var").scrollTo(0, 0); break;
    case "var-timer": timerEnd = Date.now() + 600000; clearInterval(timerInt);
      timerInt = setInterval(() => { const t = document.getElementById("timer"); if (t) t.textContent = timerText(); if (Date.now() >= timerEnd) clearInterval(timerInt); }, 1000); renderVar(); break;
    case "var-beaten": if (profile.start && matchKey() >= profile.start) setDay(matchKey(), d => { d.urges = (d.urges || 0) + 1; });
      document.getElementById("var").hidden = true; document.body.style.overflow = ""; clearInterval(timerInt); timerEnd = 0; tab = "today"; viewKey = matchKey(); render(); break;
    case "var-slip": if (profile.start && matchKey() >= profile.start) setDay(matchKey(), d => { d.red = true; });
      varSit = "slipped"; clearInterval(timerInt); timerEnd = 0; renderVar(); break;
  }
});

const mfTimers = {};
document.addEventListener("input", e => {
  const id = e.target.dataset && e.target.dataset.mf; if (!id) return;
  const val = e.target.value.slice(0, 4000);
  clearTimeout(mfTimers[id]);
  mfTimers[id] = setTimeout(() => setProfile(p => { p.manifesto = Object.assign({}, p.manifesto, { [id]: val }); }, false), 400);
});

setInterval(() => {
  if (tab !== "today" || viewKey !== matchKey()) return;
  const n = document.getElementById("nowcard"); if (!n) return;
  const a = document.activeElement; if (a && a.tagName === "INPUT") return;
  render();
}, 60000);

render();
connect();
</script>
